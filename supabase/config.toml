# Supabase project configuration
# Fill in your project_id from the Supabase dashboard URL:
# https://supabase.com/dashboard/project/<project-ref>

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
# Site URL must match your deployed frontend
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = true

[auth.sms.africas_talking]
enabled = false
# Provide via environment:
# SUPABASE_AUTH_SMS_AFRICAS_TALKING_API_KEY
# SUPABASE_AUTH_SMS_AFRICAS_TALKING_USERNAME
